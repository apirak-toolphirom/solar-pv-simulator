<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ออกแบบระบบโซลาร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--mut:#6b7785;--line:#dde2e8;--pri:#1668e3;--pri2:#e8f0fd;--ok:#16803c;--okbg:#e7f6ec;--err:#c62828;--errbg:#fdecec;--warn:#b26a00;--warnbg:#fff4e0}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:14px/1.5 'Prompt',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:1280px;margin:0 auto}
#steps{display:flex;gap:2px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:10px}
#steps button{flex:1 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mut);white-space:nowrap;min-height:40px}
#steps button b{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--line);color:#fff;font-size:12px;margin-right:6px;font-weight:600}
#steps button.on{background:var(--pri2);color:var(--pri);font-weight:600}
#steps button.on b{background:var(--pri)}
#steps button.done b{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:12px 0 6px;font-size:14px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:minmax(300px,380px) 1fr}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.f{display:block;margin:0 0 10px}
.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.f>span b{color:var(--err);margin-left:3px}
.ib{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.ib:focus-within{border-color:var(--pri)}
.ib input,.ib select{flex:1;min-width:0;border:0;outline:0;padding:8px 10px;background:transparent;min-height:38px}
.ib i{font-style:normal;color:var(--mut);padding:0 10px;white-space:nowrap}
.ib.ro{background:#f1f3f5}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:64px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{color:#fff;opacity:.92}
.btn.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-err{background:var(--errbg);color:var(--err)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--pri2);color:var(--pri)}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#dfe3e8}
.mapwrap canvas{display:block;width:100%;touch-action:none}
.mtools{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
.mtools .btn{background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mzoom{position:absolute;right:8px;bottom:26px;display:flex;flex-direction:column;gap:4px}
.mzoom .btn{width:38px;padding:0;background:rgba(255,255,255,.95)}
.attr{position:absolute;right:6px;bottom:3px;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px}
th{background:#f1f3f5;font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
#bar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-top:6px}
#bar .st{font-size:13px}
#bar .st b{margin-right:14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.kpi div{background:#f1f3f5;border-radius:8px;padding:8px 10px}
.kpi small{display:block;color:var(--mut);font-size:12px}
.kpi b{font-size:18px}
.chk{display:flex;align-items:center;gap:6px;margin:4px 0}
.chk input{width:18px;height:18px}
.note{background:var(--warnbg);color:#6b4500;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.okbox{background:var(--okbg);color:#0d5a29;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.errbox{background:var(--errbg);color:#8e1b1b;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
canvas.ch{width:100%;height:240px;display:block}
.sev{color:var(--err)}.sok{color:var(--ok)}
.mi{width:64px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:32px}
@media print{#steps,#bar,.noprint,.mtools,.mzoom{display:none!important}body{background:#fff}.card{break-inside:avoid;border:0;padding:6px 0}}
</style>
</head>
<body>
<div id="app">
  <nav id="steps"></nav>
  <main id="view"></main>
  <div id="bar"><div class="st" id="stat"></div><div class="row"><button class="btn" id="prev">ย้อนกลับ</button><button class="btn pri" id="next">ถัดไป</button></div></div>
</div>
<script>
'use strict';
/* =====================================================================
   ออกแบบระบบโซลาร์: 7 ขั้น (ข้อมูลโครงการ → ไฟฟ้า → วาดหลังคา → วางแผง → ต่อสาย → ต้นทุน → รายงาน)
   ค่ารังสีอาทิตย์ดึงจาก NASA POWER ตามพิกัด (ถ้าออนไลน์ไม่ได้ใช้ตารางประมาณการประเทศไทย)
   ค่าที่คำนวณเป็นการประมาณเพื่อการเรียนรู้ ไม่ใช่ผลรับรอง
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx=(v,d=0)=>isFinite(v)?Number(v).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MKEY=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MDAYS=[31,28,31,30,31,30,31,31,30,31,30,31],MDOY=[17,47,75,105,135,162,198,228,258,288,318,344];
const DIRS=['เหนือ','ตะวันออกเฉียงเหนือ','ตะวันออก','ตะวันออกเฉียงใต้','ใต้','ตะวันตกเฉียงใต้','ตะวันตก','ตะวันตกเฉียงเหนือ'];
const dirName=a=>DIRS[Math.round((((a%360)+360)%360)/45)%8];

/* ---------- Plus Code (ถอดรหัสอย่างเดียว) ---------- */
const OLC='23456789CFGHJMPQRVWX';
function olcDecode(code){const c=code.replace('+','').replace(/0+$/,'');if(c.length<2||c.indexOf('0')>=0)return null;const pl=Math.min(c.length,10);if(pl%2)return null;
  let lat=-90,lng=-180,res=20,sa=0,so=0;for(let i=0;i<pl;i+=2){const a=OLC.indexOf(c[i]),b=OLC.indexOf(c[i+1]);if(a<0||b<0)return null;lat+=a*res;lng+=b*res;sa=so=res;res/=20}
  for(let i=10;i<c.length;i++){const d=OLC.indexOf(c[i]);if(d<0)return null;sa/=5;so/=4;lat+=Math.floor(d/4)*sa;lng+=(d%4)*so}
  return lat>=90||lng>=180?null:{lat:lat+sa/2,lon:lng+so/2}}
function olcEncodePrefix(lat,lng,n){lat=clamp(lat,-90,90-1e-9);lng=((lng+180)%360+360)%360;let la=Math.floor((lat+90)*8000+1e-7),lo=Math.floor(lng*8000+1e-7);const a=[],b=[];
  for(let i=0;i<5;i++){a.unshift(la%20);la=Math.floor(la/20);b.unshift(lo%20);lo=Math.floor(lo/20)}let c='';for(let i=0;i<5;i++)c+=OLC[a[i]]+OLC[b[i]];return c.slice(0,n)}
function parseLoc(t,refLat,refLon){t=(t||'').trim();if(!t)return null;
  let m=t.match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(m){const la=+m[1],lo=+m[2];return Math.abs(la)<=90&&Math.abs(lo)<=180?{lat:la,lon:lo}:null}
  const tok=t.split(/\s+/)[0].toUpperCase();if(!/^[23456789CFGHJMPQRVWX0]*\+[23456789CFGHJMPQRVWX]*$/.test(tok))return null;
  const plus=tok.indexOf('+');if(plus===8)return olcDecode(tok);
  if(plus<8&&plus%2===0){const pad=8-plus,res=Math.pow(20,2-pad/2),half=res/2,d=olcDecode(olcEncodePrefix(refLat,refLon,pad)+tok);if(!d)return null;
    let la=d.lat,lo=d.lon;if(refLat+half<la)la-=res;else if(refLat-half>la)la+=res;if(refLon+half<lo)lo-=res;else if(refLon-half>lo)lo+=res;return{lat:la,lon:lo}}
  return null}

/* ---------- ตำแหน่งดวงอาทิตย์ (เวลาสุริยะ) ---------- */
function decl(doy){const g=2*Math.PI/365*(doy-1);return 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g)}
function sunAt(lat,doy,hs){const d=decl(doy),la=rad(lat),w=rad((hs-12)*15);
  const cz=Math.sin(la)*Math.sin(d)+Math.cos(la)*Math.cos(d)*Math.cos(w),zen=Math.acos(clamp(cz,-1,1)),sz=Math.sin(zen);
  let az=Math.PI;if(sz>1e-6){az=Math.acos(clamp((Math.sin(d)-Math.sin(la)*cz)/(Math.cos(la)*sz),-1,1));if(w>0)az=2*Math.PI-az}
  return{cz,zen,az:deg(az),alt:90-deg(zen)}}

/* ---------- ข้อมูลสภาพอากาศ ---------- */
// ตารางสำรอง: ค่าเฉลี่ยรายเดือนของประเทศไทย (ประมาณ) ใช้เมื่อดึงจาก NASA ไม่ได้
const FALL={ghi:[5.1,5.8,6.0,5.9,5.3,4.9,4.7,4.6,4.6,4.7,4.9,4.8],t:[25.5,27.5,29.5,30.5,29.5,28.8,28.3,28.0,27.8,27.5,26.5,24.8],tmax:[32.5,34.5,36,36.5,34.5,33.5,32.5,32,32,32,32,31],tmin:[18.5,20.5,23,25,25,25,24.5,24.5,24.5,23.5,21,18]};
const PROFILES={
  home:['ครัวเรือน (ใช้เช้าและเย็น)',[2.2,2,1.9,1.9,2,2.4,3.6,4.2,3.4,3,3,3.2,3.4,3.2,3.2,3.4,3.8,5,6.2,6.6,6.2,5.4,4.2,3]],
  day:['ร้านค้า/สำนักงาน (ใช้กลางวัน)',[1.5,1.5,1.5,1.5,1.5,1.5,1.5,3,5,6.5,7,7.2,6.8,7,7,6.8,6,4.5,3,2.5,2,1.8,1.6,1.5]],
  night:['ใช้ช่วงเย็น–กลางคืน (แอร์ห้องนอน)',[6,6,6,5.5,4,3,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.8,3.5,4.5,5.5,6,6.5,6.5,6.5,6.5]],
  flat:['ใช้คงที่ทั้งวัน',Array(24).fill(1)]};
const tzOf=lon=>lon>=97&&lon<=106?7:Math.round(lon/15);

/* ---------- แคตตาล็อกอุปกรณ์ (ดึงจากเมนู 02 ถ้ารันในโปรแกรมจำลอง) ---------- */
const FALLCAT={panels:[{id:'ex650',brand:'ตัวอย่าง',model:'650 W (ค่าสมมติ)',pmax:650,voc:53.9,vmp:44.56,isc:15.29,imp:14.59,kVoc:-0.2,kPmax:-0.26,noct:45,note:'2382×1134 mm'}],
  inverters:[{id:'ex6',brand:'ตัวอย่าง',model:'On-grid 1 เฟส 6 kW (ค่าสมมติ)',type:'on-grid',phase:'1',pac:6000,vmax:550,lo:90,hi:520,start:100,imax:16,isc:22,nmppt:2,pvRec:9000,eff:97},
    {id:'ex10',brand:'ตัวอย่าง',model:'On-grid 3 เฟส 10 kW (ค่าสมมติ)',type:'on-grid',phase:'3',pac:10000,vmax:1100,lo:160,hi:950,start:180,imax:16,isc:22,nmppt:2,pvRec:15000,eff:98}]};
function cat(){try{if(window.parent&&window.parent!==window){const c=window.parent.eval('CAT');if(c&&c.panels&&c.inverters)return c}}catch(e){}return FALLCAT}
function panelDims(p){const m=/(\d{3,4})\s*[×x]\s*(\d{3,4})/.exec(p.note||'');if(m){const a=+m[1]/1000,b=+m[2]/1000;return[Math.max(a,b),Math.min(a,b)]}
  const k=p.pmax||550;return k>=600?[2.382,1.134]:k>=500?[2.278,1.134]:k>=400?[1.72,1.134]:[1.65,1]}

/* ---------- สถานะโครงการ ---------- */
const DEF=()=>({v:1,name:'โครงการของฉัน',customer:'',addr:'',lat:15.2447,lon:104.8472,grid:'1',feedLimit:'',desc:'',tmin:12,
  cons:{type:'model',annual:5356,monthly:[400,450,600,705,409,392,400,400,400,400,400,400],profile:'home',buy:4.4,fit:2.2,growth:2,disc:3.7},
  roof:{pts:[],height:6,type:'flat',pitch:15,facing:180},
  pv:{id:'',pmax:0,voc:0,vmp:0,isc:0,imp:0,kVoc:-0.25,kPmax:-0.3,noct:44,L:2.382,W:1.134},
  lay:{orient:'portrait',tilt:10,az:180,setback:0.5,gap:0.02,off:{}},
  inv:{mode:'auto',ratio:120,id:'',n:1,man:[],meter:true,comm:false},
  loss:10,cost:{type:'perW',perW:28,total:0,om:0.25,years:25,deg:0.5}});
let S=DEF();
try{const j=localStorage.getItem('pvsim:design:v1');if(j){const o=JSON.parse(j);if(o&&o.v===1)S=Object.assign(DEF(),o)}}catch(e){}
const getp=(p)=>p.split('.').reduce((o,k)=>o==null?o:o[k],S);
const setp=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
let CLIM=null,CLIMSRC='',CLIMMSG='';
let saveT=0;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('pvsim:design:v1',JSON.stringify(S))}catch(e){}},400)};

async function loadClimate(){
  const lat=S.lat,lon=S.lon;CLIMMSG='กำลังดึงข้อมูลรังสีอาทิตย์จาก NASA POWER ...';paintClim();
  try{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);
    const u=`https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=ALLSKY_SFC_SW_DWN,T2M,T2M_MAX,T2M_MIN&community=RE&longitude=${lon.toFixed(4)}&latitude=${lat.toFixed(4)}&format=JSON`;
    const r=await fetch(u,{signal:ac.signal});clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(),p=j.properties.parameter,g=k=>MKEY.map(m=>+p[k][m]);
    const c={ghi:g('ALLSKY_SFC_SW_DWN'),t:g('T2M'),tmax:g('T2M_MAX'),tmin:g('T2M_MIN')};
    if(Object.values(c).some(a=>a.some(v=>!isFinite(v)||v<-90)))throw new Error('ข้อมูลไม่ครบ');
    const gc=j.geometry&&j.geometry.coordinates;
    CLIM=c;CLIMSRC='nasa';CLIMMSG=`ข้อมูลจริง: NASA POWER (ค่าเฉลี่ยหลายปี กริด 0.5° ใกล้ ${gc?gc[1].toFixed(2)+', '+gc[0].toFixed(2):'พิกัดที่เลือก'})`;
  }catch(e){CLIM=FALL;CLIMSRC='fallback';CLIMMSG='ดึงข้อมูลออนไลน์ไม่ได้ ('+(e.name==='AbortError'?'หมดเวลา':e.message)+') ใช้ตารางประมาณการประเทศไทยแทน ผลจะคลาดเคลื่อนได้มากกว่า'}
  S.tmin=Math.round(Math.min(...CLIM.tmin)-2);inval();paintClim();refresh();
}
let climT=0;const climSoon=()=>{clearTimeout(climT);climT=setTimeout(loadClimate,900)};

/* ---------- เรขาคณิตหลังคา (เมตร, x=ตะวันออก y=เหนือ) ---------- */
const MLAT=111320;
function geo(){const p=S.roof.pts;if(!p.length)return null;const la0=p.reduce((a,q)=>a+q[0],0)/p.length,lo0=p.reduce((a,q)=>a+q[1],0)/p.length,k=Math.cos(rad(la0))*MLAT;
  const xy=p.map(q=>[(q[1]-lo0)*k,(q[0]-la0)*MLAT]);return{la0,lo0,k,xy}}
const toLL=(g,x,y)=>[g.la0+y/MLAT,g.lo0+x/g.k];
function polyArea(xy){let a=0;for(let i=0;i<xy.length;i++){const j=(i+1)%xy.length;a+=xy[i][0]*xy[j][1]-xy[j][0]*xy[i][1]}return a/2}
function inPoly(xy,x,y){let c=false;for(let i=0,j=xy.length-1;i<xy.length;j=i++){const[a,b]=xy[i],[p,q]=xy[j];if((b>y)!==(q>y)&&x<(p-a)*(y-b)/(q-b)+a)c=!c}return c}
function dSeg(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;t=clamp(t,0,1);return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)}
const dEdge=(xy,x,y)=>Math.min(...xy.map((a,i)=>dSeg(x,y,a,xy[(i+1)%xy.length])));
function edgeInfo(xy){return xy.map((a,i)=>{const b=xy[(i+1)%xy.length],dx=b[0]-a[0],dy=b[1]-a[1];return{len:Math.hypot(dx,dy),brg:(deg(Math.atan2(dx,dy))+360)%360}})}

/* ---------- วางแผง ---------- */
function layoutKey(){return JSON.stringify([S.roof.pts,S.roof.type,S.roof.pitch,S.roof.facing,S.pv.L,S.pv.W,S.lay.orient,S.lay.tilt,S.lay.az,S.lay.setback,S.lay.gap,S.lat])}
let LAY=null,LAYK='';
function plane(){const flush=S.roof.type==='pitched';return{tilt:flush?S.roof.pitch:S.lay.tilt,az:flush?S.roof.facing:S.lay.az}}
function rowPitch(tilt,az,slopeLen){const b=rad(tilt),d=slopeLen*Math.cos(b);
  if(S.roof.type==='pitched'||tilt<1)return{d,pitch:d+S.lay.gap};
  const h=slopeLen*Math.sin(b),s=sunAt(S.lat,355,9),sh=s.alt>2?h/Math.tan(rad(s.alt))*Math.abs(Math.cos(rad(s.az-az))):0;
  return{d,pitch:d+Math.max(sh,0.1),shadow:sh}}
let AUTO=null,AUTOK='';
function autoGrid(){
  const k=layoutKey();if(AUTO&&AUTOK===k)return AUTO;AUTOK=k;const g=geo();
  if(!g||g.xy.length<3||!S.pv.pmax){AUTO={mods:[],g,n:0};return AUTO}
  const{tilt,az}=plane(),land=S.lay.orient==='landscape',sl=land?S.pv.W:S.pv.L,wd=land?S.pv.L:S.pv.W,rp=rowPitch(tilt,az,sl);
  const c=Math.cos(rad(az)),s=Math.sin(rad(az)),A=([x,y])=>[x*c-y*s,x*s+y*c],xyAB=g.xy.map(A);

    const mods=activeMods(),sl=L.sl||1,tl=rad(L.tilt||0),cA=L.c,sA=L.s;

function setupCv(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,W:r.width,H:r.height}}

  c.clearRect(0,0,W,H);c.font='11px Prompt,sans-serif';c.strokeStyle='#dde2e8';c.fillStyle='#6b7785';
  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);c.beginPath();c.moveTo(pl,y);c.lineTo(W-4,y);c.stroke();c.textAlign='right';c.fillText(fx(mx*i/4,mx<10?1:0),pl-4,y+4)}
  const bw=Math.min(18,(gw-4)/series.length);labels.forEach((l,i)=>{series.forEach((s,k)=>{const h=(H-pt-pb)*s.v[i]/mx;c.fillStyle=s.c;c.fillRect(pl+i*gw+(gw-bw*series.length)/2+k*bw,H-pb-h,bw-1,h)});c.fillStyle='#6b7785';c.textAlign='center';c.fillText(l,pl+i*gw+gw/2,H-8)});
  c.textAlign='left';let x=pl;series.forEach(s=>{c.fillStyle=s.c;c.fillRect(x,6,10,10);c.fillStyle='#1f2933';c.fillText(s.n,x+14,15);x+=c.measureText(s.n).width+34});c.fillStyle='#6b7785';c.textAlign='right';c.fillText(unit,W-4,15)}

  $('#geo').onclick=async()=>{const q=S.addr.trim();if(!q)return;$('#locmsg').textContent='กำลังค้นหา ...';try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const j=await r.json();
    if(!j.length){$('#locmsg').textContent='ไม่พบที่อยู่นี้';return}S.lat=+j[0].lat;S.lon=+j[0].lon;MAP.lat=S.lat;MAP.lon=S.lon;MAP.z=18;MAP.render();pinUp();$('#locmsg').textContent='พบ: '+j[0].display_name}catch(e){$('#locmsg').textContent='ค้นหาไม่ได้ (ออฟไลน์?) ใส่พิกัดเอง'}};
  async function revGeo(){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=th&lat=${S.lat}&lon=${S.lon}`);const j=await r.json();if(j.display_name){S.addr=j.display_name;const e=$('[data-b="addr"]');if(e)e.value=S.addr}}catch(e){}}
  $('#reclim').onclick=loadClimate;paintClim();if(!CLIM)loadClimate()},

/* ---------- ขั้น 3: วาดหลังคา ---------- */
roof(){
  $('#view').innerHTML=`<div class="grid g2"><div class="card"><h2>แบบจำลองอาคาร</h2>
  <div class="row" style="margin-bottom:8px"><button class="btn sm" id="tdraw">วาดหลังคา</button><button class="btn sm" id="tfin">จบรูป</button><button class="btn sm" id="tundo">ลบจุดล่าสุด</button><button class="btn sm" id="tclr">ล้างทั้งหมด</button></div>
  <div class="small mut" style="margin-bottom:8px">กด “วาดหลังคา” แล้วคลิกที่มุมหลังคาทีละมุมบนภาพดาวเทียม (ซูมให้เห็นหลังคาชัด) แล้วกด “จบรูป” หรือคลิกจุดแรกอีกครั้ง ลากจุดเพื่อแก้ตำแหน่ง ความยาวขอบแสดงเป็นเมตร</div>
  ${fld('roof.height','ความสูงอาคาร (ถึงพื้นหลังคา)',{type:'number',unit:'ม.',step:'0.5',min:0})}
  ${sel('roof.type','ชนิดหลังคา',[['flat','หลังคาดาดฟ้า (วางแผงบนขาตั้งเอียง)'],['pitched','หลังคาเอียง (วางแผงขนานผิวหลังคา)']])}
  ${S.roof.type==='pitched'?fld('roof.pitch','ความลาดเอียงหลังคา',{type:'number',unit:'°',min:0})+fld('roof.facing','หลังคาหันไปทางทิศ (องศาจากทิศเหนือ)',{type:'number',unit:'°',min:0}):''}
  <div id="roofst"></div></div>
  <div><div class="mapwrap" id="m3"></div><div class="small mut" style="margin:4px 2px">ภาพดาวเทียมมีความคลาดเคลื่อนได้ ตรวจขนาดจริงด้วยตลับเมตรก่อนสั่งของ</div></div></div>`;
  const rd=()=>{const E=$('#roofst');if(!E)return;const g=geo();if(!g||g.xy.length<3){E.innerHTML='<div class="small mut">ยังไม่มีรูปหลังคา</div>';return}
    const a=Math.abs(polyArea(g.xy)),ei=edgeInfo(g.xy);E.innerHTML=`<div class="kpi"><div><small>พื้นที่หลังคา</small><b>${fx(a,1)} ตร.ม.</b></div><div><small>จำนวนมุม</small><b>${g.xy.length}</b></div></div><div class="small">ขอบ: ${ei.map(e=>fx(e.len,2)+' ม. ('+Math.round(e.brg)+'°)').join(' · ')}</div>`};
  const setTool=t=>{roofTool=t;$('#tdraw').classList.toggle('on',t==='draw');MAP.cv.style.cursor=t==='draw'?'crosshair':''};
  MAP=mkMap('m3',{lat:S.roof.pts.length?S.roof.pts[0][0]:S.lat,lon:S.roof.pts.length?S.roof.pts[0][1]:S.lon,z:19,h:520,
    draw(c,m){drawRoof(c,m,true)},
    hit(x,y,m){const p=S.roof.pts;for(let i=0;i<p.length;i++){const[px,py]=m.toS(p[i][0],p[i][1]);if(Math.hypot(px-x,py-y)<14){if(roofTool==='draw'&&i===0&&p.length>=3&&!S.roof.closed)return{click:()=>{S.roof.closed=true;setTool('view');inval();m.render();rd();refresh()}};
        return{drag:(la,lo)=>{p[i]=[la,lo];S.lay.off={};inval();m.render();rd();refresh()}}}}return null},
    click(la,lo,m){if(roofTool==='draw'){S.roof.pts.push([la,lo]);S.roof.closed=false;inval();m.render();rd();refresh()}}});
  setTool(S.roof.pts.length?'view':'draw');
  $('#tdraw').onclick=()=>{if(S.roof.closed){S.roof.pts=[];S.roof.closed=false}setTool('draw');MAP.render()};
  $('#tfin').onclick=()=>{if(S.roof.pts.length>=3){S.roof.closed=true;setTool('view');S.lay.off={};inval();MAP.render();rd();refresh()}};
  $('#tundo').onclick=()=>{S.roof.pts.pop();S.roof.closed=false;inval();MAP.render();rd();refresh()};
  $('#tclr').onclick=()=>{S.roof.pts=[];S.roof.closed=false;S.lay.off={};inval();setTool('draw');MAP.render();rd();refresh()};
  rd()},

/* ---------- ขั้น 4: วางแผง ---------- */
layout(){const C=cat(),P=S.pv,flush=S.roof.type==='pitched';
  if(!P.pmax||!C.panels.some(p=>p.id===P.id)){const p=C.panels.find(x=>x.id===P.id)||C.panels[0];if(p)usePanel(p)}

  <div class="small mut" style="margin:-4px 0 8px">${fx(P.pmax)} W · Voc ${P.voc} V · Vmp ${P.vmp} V · Isc ${P.isc} A · Imp ${P.imp} A</div>
  <div class="grid g3" style="grid-template-columns:1fr 1fr">${fld('pv.L','ความยาวแผง',{type:'number',step:'0.001',unit:'ม.'})}${fld('pv.W','ความกว้างแผง',{type:'number',step:'0.001',unit:'ม.'})}</div>
  ${sel('lay.orient','การวางแผง',[['portrait','แนวตั้ง'],['landscape','แนวนอน']])}
  ${flush?`<div class="small mut" style="margin-bottom:8px">หลังคาเอียง: แผงวางขนานหลังคา เอียง ${S.roof.pitch}° หัน ${S.roof.facing}° (${dirName(S.roof.facing)})</div>`:
  fld('lay.tilt','มุมเอียงแผง',{type:'number',unit:'°',min:0})+fld('lay.az','ทิศที่แผงหัน (0=เหนือ 90=ออก 180=ใต้)',{type:'number',unit:'°',min:0})+`<div class="row" style="margin:-4px 0 10px">${[['ใต้',180],['ตะวันออก',90],['ตะวันตก',270]].map(([n,a])=>`<button class="btn sm" data-az="${a}">${n}</button>`).join('')}<button class="btn sm" id="azedge">ขนานขอบหลังคา</button></div>`}
  ${fld('lay.setback','ระยะเว้นจากขอบหลังคา',{type:'number',step:'0.1',unit:'ม.',min:0})}${fld('lay.gap','ช่องว่างระหว่างแผง',{type:'number',step:'0.01',unit:'ม.',min:0})}
  <div id="laynote"></div>
  <h3>การวางแผง</h3><div class="row"><button class="btn sm${man?'':' on'}" id="lmax">ใส่แผงสูงสุด (อัตโนมัติ)</button><button class="btn sm${man?' on':''}" id="lman">วางแผงเอง</button></div>
  ${man?`<div class="row" style="margin-top:6px"><button class="btn sm${layTool==='add'?' on':''}" id="tadd">เพิ่มแผง</button><button class="btn sm${layTool==='sel'?' on':''}" id="tsel">เลือก/ย้าย</button><button class="btn sm" id="tdel">ลบแผงที่เลือก</button><button class="btn sm" id="tfill">เติมให้เต็มที่ว่าง</button><button class="btn sm" id="tclr2">ล้างแผงทั้งหมด</button></div><div class="small mut" id="manmsg" style="margin-top:4px">โหมดวางแผงเอง: คลิกที่ว่างบนหลังคาเพื่อเพิ่ม ลากแผงเพื่อย้าย (ดูดเข้าแนวแผงข้างเคียง) แผงสีแดงวางไม่ได้และไม่นับ</div>`:`<div class="row" style="margin-top:6px"><button class="btn sm" id="lreset">คืนแผงที่ลบทั้งหมด</button></div>`}</div>
  <div><div class="row noprint" style="margin-bottom:6px"><button class="btn sm${view3==='2d'?' on':''}" id="v2">2D แผนที่</button><button class="btn sm${view3==='3d'?' on':''}" id="v3">3D</button></div>
  <div class="mapwrap" id="m4"></div><div class="small mut" style="margin:4px 2px">${view3==='2d'?(man?'เพิ่มแผง: คลิกที่ว่างบนหลังคา · ลากแผงเพื่อย้าย · คลิกแผงเพื่อเลือก (กรอบเหลือง) แล้วกด “ลบแผงที่เลือก” หรือปุ่ม Delete':'คลิกที่แผงเพื่อลบ/ใส่คืน (แผงสีเทาคือแผงที่ลบแล้ว)'):'ลากเพื่อหมุนมุมมอง'}</div></div></div>`;
  $('#pbr').onchange=e=>{usePanel(C.panels.find(p=>p.brand===e.target.value));VIEWS.layout();refresh()};
  $('#pmd').onchange=e=>{usePanel(C.panels.find(p=>p.id===e.target.value));VIEWS.layout();refresh()};
  $$('[data-az]').forEach(b=>b.onclick=()=>{S.lay.az=+b.dataset.az;S.lay.off={};inval();applyAuto();VIEWS.layout();refresh()});
  const ae=$('#azedge');if(ae)ae.onclick=()=>{const g=geo();if(!g)return;const ei=edgeInfo(g.xy);let best=180,bd=999;ei.forEach(e=>[0,90,180,270].forEach(o=>{const a=(e.brg+90+o)%360,d=Math.min(Math.abs(a-180),360-Math.abs(a-180));if(d<bd){bd=d;best=a}}));S.lay.az=Math.round(best);S.lay.off={};inval();applyAuto();VIEWS.layout();refresh()};
  const lr=$('#lreset');if(lr)lr.onclick=()=>{S.lay.off={};inval();if(MAP)MAP.render();refresh()};
  const mmsg=t=>{const e=$('#manmsg');if(e)e.textContent=t};
  $('#lmax').onclick=()=>{manualAuto();applyAuto();VIEWS.layout();refresh()};
  $('#lman').onclick=()=>{if(!Array.isArray(S.lay.manual))manualEnter();applyAuto();VIEWS.layout();refresh()};
  if(man){const redraw=()=>{applyAuto();if(MAP)MAP.render();if(V3D)V3D.render();refresh()};
    $('#tadd').onclick=()=>{layTool='add';VIEWS.layout();refresh()};$('#tsel').onclick=()=>{layTool='sel';VIEWS.layout();refresh()};
    $('#tdel').onclick=()=>{if(manualDelSel())redraw();else mmsg('ยังไม่ได้เลือกแผง คลิกที่แผงก่อน')};
    $('#tfill').onclick=()=>{const n=manualFill();redraw();mmsg(n?'เติมแผงเพิ่ม '+n+' แผง':'ไม่มีที่ว่างพอสำหรับแผงเพิ่ม')};
    $('#tclr2').onclick=()=>{S.lay.manual=[];selIdx=-1;inval();LAYK='';redraw()}}
  $('#v2').onclick=()=>{view3='2d';VIEWS.layout();refresh()};$('#v3').onclick=()=>{view3='3d';VIEWS.layout();refresh()};
  if(view3==='3d'){MAP=null;V3D=new V3($('#m4'),520)}else{const g=geo();let rev=null;MAP=mkMap('m4',{lat:g?g.la0:S.lat,lon:g?g.lo0:S.lon,z:19,h:520,draw(c,m){drawRoof(c,m,false);drawMods(c,m,true)},
    hit(x,y,m){const L=getLayout();if(!L.g)return null;for(let k=L.mods.length-1;k>=0;k--){const md=L.mods[k],q=modPoly(L,md).map(p=>m.toS(p[0],p[1])),xs=q.map(p=>p[0]),ys=q.map(p=>p[1]);
      if(x>=Math.min(...xs)&&x<=Math.max(...xs)&&y>=Math.min(...ys)&&y<=Math.max(...ys)&&inPoly(q,x,y)){
        if(!L.manual)return{click:()=>{S.lay.off[md.key]?delete S.lay.off[md.key]:S.lay.off[md.key]=1;inval();LAYK='';m.render();refresh()}};
        const idx=md.idx,cen=S.lay.manual[idx],[cx,cy]=m.toS(cen[0],cen[1]),ox=x-cx,oy=y-cy;selIdx=idx;
        return{click:()=>{selIdx=idx;m.render()},drag:(la,lo)=>{if(!rev)rev={idx,pos:S.lay.manual[idx].slice()};selIdx=idx;const[px,py]=m.toS(la,lo),p=m.fromS(px-ox,py-oy);
          S.lay.manual[idx]=snapCenter(getLayout(),autoGrid(),p[0],p[1],idx);LAYK='';m.render()}}}}return null},
    click(la,lo,m){if(!Array.isArray(S.lay.manual)){return}if(layTool==='sel'){selIdx=-1;m.render();return}
      const ok=manualAdd(la,lo);const e=$('#manmsg');if(e)e.textContent=ok?'เพิ่มแผงแล้ว':'วางตรงนี้ไม่ได้ (ล้ำขอบ/ไม่เว้นตามระยะที่ตั้ง/ซ้อนแผงอื่น)';m.render();applyAuto();refresh()},
    end(m){if(rev){LAYK='';const md=getLayout().mods[rev.idx];if(md&&md.bad){S.lay.manual[rev.idx]=rev.pos;LAYK='';const e=$('#manmsg');if(e)e.textContent='ย้ายไปตรงนั้นไม่ได้ จึงคืนที่เดิม'}rev=null;applyAuto();m.render();refresh()}}})}
  UPD.layout()},
};
function usePanel(p){if(!p)return;const d=panelDims(p);Object.assign(S.pv,{id:p.id,pmax:p.pmax,voc:p.voc,vmp:p.vmp,isc:p.isc,imp:p.imp,kVoc:p.kVoc!=null?p.kVoc:-0.25,kPmax:p.kPmax!=null?p.kPmax:-0.3,noct:p.noct||44,L:d[0],W:d[1]});S.lay.off={};inval();applyAuto()}
function modPoly(L,m){const c=L.c,s=L.s;return[[m.a,m.b],[m.a+m.w,m.b],[m.a+m.w,m.b+m.d],[m.a,m.b+m.d]].map(([a,b])=>toLL(L.g,a*c+b*s,-a*s+b*c))}
function drawRoof(c,m,edit){const p=S.roof.pts;if(!p.length)return;const q=p.map(v=>m.toS(v[0],v[1]));c.lineWidth=2;c.strokeStyle='#fff';c.fillStyle='rgba(255,255,255,.28)';c.beginPath();q.forEach((v,i)=>i?c.lineTo(v[0],v[1]):c.moveTo(v[0],v[1]));if(S.roof.closed||!edit)c.closePath();c.fill();c.stroke();
  if(edit){const g=geo();q.forEach((v,i)=>{c.fillStyle=i===0&&!S.roof.closed?'#ffb300':'#fff';c.strokeStyle='#1668e3';c.beginPath();c.arc(v[0],v[1],6,0,7);c.fill();c.stroke()});
    if(g&&(S.roof.closed||q.length>1)){const ei=edgeInfo(g.xy),cnt=S.roof.closed?q.length:q.length-1;c.font='12px Prompt,sans-serif';for(let i=0;i<cnt;i++){const a=q[i],b=q[(i+1)%q.length],t=fx(ei[i].len,2)+' ม.',w=c.measureText(t).width+8,mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;c.fillStyle='rgba(255,255,255,.92)';c.fillRect(mx-w/2,my-9,w,18);c.fillStyle='#1f2933';c.textAlign='center';c.fillText(t,mx,my+4)}c.textAlign='left'}}}
function drawMods(c,m,edit){const L=getLayout();if(!L.g)return;L.mods.forEach(md=>{if(md.bad&&!edit)return;const q=modPoly(L,md).map(p=>m.toS(p[0],p[1])),off=S.lay.off[md.key],sel=edit&&L.manual&&md.idx===selIdx;c.beginPath();q.forEach((v,i)=>i?c.lineTo(v[0],v[1]):c.moveTo(v[0],v[1]));c.closePath();

  <div class="card"><h2>พลังงานรายเดือน</h2><canvas class="ch" id="rc1"></canvas><div class="scroll"><table><tr><th></th>${MON.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">รวม</th></tr>
  <tr><td>รังสีบนระนาบแผง (kWh/ตร.ม.)</td>${R.months.map(m=>`<td class="n">${fx(m.poa*m.days)}</td>`).join('')}<td class="n"><b>${fx(R.tot.poa)}</b></td></tr>
  <tr><td>ผลิตไฟ (kWh)</td>${R.months.map(m=>`<td class="n">${fx(m.gen)}</td>`).join('')}<td class="n"><b>${fx(R.tot.gen)}</b></td></tr>
  <tr><td>การใช้ไฟ (kWh)</td>${R.months.map(m=>`<td class="n">${fx(m.load)}</td>`).join('')}<td class="n"><b>${fx(R.tot.load)}</b></td></tr>
  <tr><td>ใช้เองจากโซลาร์ (kWh)</td>${R.months.map(m=>`<td class="n">${fx(m.self)}</td>`).join('')}<td class="n"><b>${fx(R.tot.self)}</b></td></tr>
  <tr><td>ขายคืน (kWh)</td>${R.months.map(m=>`<td class="n">${fx(m.exp)}</td>`).join('')}<td class="n"><b>${fx(R.tot.exp)}</b></td></tr>
  <tr><td>ซื้อจากการไฟฟ้า (kWh)</td>${R.months.map(m=>`<td class="n">${fx(m.imp)}</td>`).join('')}<td class="n"><b>${fx(R.tot.imp)}</b></td></tr></table></div>
  <div class="kpi"><div><small>ผลิตต่อ kWp ต่อปี</small><b>${fx(E.yieldKwp)} kWh</b></div><div><small>Performance Ratio</small><b>${fx(R.tot.poa?R.tot.gen/(R.tot.poa*R.kwp)*100:0,1)}%</b></div><div><small>ใช้เองคิดเป็น % ของที่ผลิต</small><b>${fx(E.selfPct,0)}%</b></div><div><small>โซลาร์ครอบคลุมการใช้ไฟ</small><b>${fx(E.covPct,0)}%</b></div></div></div>
  <div class="card"><h2>ความคุ้มค่า</h2><div class="kpi"><div><small>ต้นทุนติดตั้ง</small><b>${fx(E.cap)} บาท</b></div><div><small>ค่าไฟก่อนติดโซลาร์</small><b>${fx(E.bill0)} บาท/ปี</b></div><div><small>ประหยัดปีแรก</small><b>${fx(E.y1save)} บาท</b></div><div><small>คืนทุน</small><b>${E.pay!=null?fx(E.pay,1)+' ปี':'ไม่คืนทุน'}</b></div><div><small>NPV (${S.cost.years} ปี)</small><b>${fx(E.npv)} บาท</b></div><div><small>IRR</small><b>${E.irr!=null?fx(E.irr*100,1)+'%':'–'}</b></div><div><small>ต้นทุนไฟต่อหน่วย (LCOE)</small><b>${E.lcoe!=null?fx(E.lcoe,2):'–'} บาท/kWh</b></div></div><canvas class="ch" id="rc2"></canvas>
  <div class="small mut">สมมติ: ค่าไฟซื้อ ${S.cons.buy} บาท/หน่วย ขึ้นปีละ ${S.cons.growth}% · รับซื้อ ${S.cons.fit} บาท/หน่วย · คิดลด ${S.cons.disc}% · แผงเสื่อม ${S.cost.deg}%/ปี · ไม่รวมภาษี เงินกู้ และการเปลี่ยนอินเวอร์เตอร์</div></div>
  <div class="card small mut">แหล่งข้อมูลรังสี: ${esc(CLIMMSG)} · แบบจำลอง: แยกรังสีตรง/กระจาย (Erbs) บนระนาบเอียง (Hay-Davies) รายชั่วโมงของวันตัวแทนแต่ละเดือน ปรับกำลังตามอุณหภูมิเซลล์ (NOCT) และตัดกำลังที่เกินอินเวอร์เตอร์ · ผลจริงขึ้นกับเงา สภาพหลังคา และอุปกรณ์</div>`;
  const g=geo();const m1=new TMap($('#rm'),{lat:g.la0,lon:g.lo0,z:19,h:300,draw(c,m){drawRoof(c,m,false);drawMods(c,m)}});
  if(g){const xs=g.xy.map(q=>q[0]),ys=g.xy.map(q=>q[1]),ext=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),5);while(m1.z>3&&ext/m1.mpp()>Math.min(m1.W,m1.H)*0.8)m1.z--;m1.render()}
  new V3($('#r3'),300);
  $('#rprint').onclick=()=>window.print();
  $('#rsave').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.name||'design')+'.json';a.click()};
  $('#ropen').onclick=()=>$('#rfile').click();
  $('#rfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.v!==1)throw 0;S=Object.assign(DEF(),o);inval();LAYK='';go(0)}catch(x){alert('ไฟล์โครงการไม่ถูกต้อง')}})};
  $('#rcsv').onclick=()=>{const rows=[['เดือน','รังสีบนระนาบแผง kWh/m2','ผลิต kWh','ใช้ไฟ kWh','ใช้เอง kWh','ขายคืน kWh','ซื้อ kWh']].concat(R.months.map((m,i)=>[MON[i],(m.poa*m.days).toFixed(1),m.gen.toFixed(1),m.load.toFixed(1),m.self.toFixed(1),m.exp.toFixed(1),m.imp.toFixed(1)]));
    const b=new Blob(['﻿'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.name||'design')+'.csv';a.click()};
  $('#rsend').onclick=()=>{publish(true);$('#rsend').textContent='ส่งแล้ว ✓'};
  publish(true);
  drawReportCharts()};
function drawReportCharts(){const c1=$('#rc1'),c2=$('#rc2');if(!c1||!c2)return;const R=simulate(),E=economics();
  bars(c1,MON,[{n:'ผลิต',v:R.months.map(m=>m.gen),c:'#1668e3'},{n:'ใช้ไฟ',v:R.months.map(m=>m.load),c:'#9aa5b1'},{n:'ใช้เอง',v:R.months.map(m=>m.self),c:'#16803c'}],'kWh');
  line(c2,E.cum.map((_,i)=>i),E.cum,'บาท (สะสม)')}

/* ---------- เริ่มต้น ---------- */
window.DS={manualEnter,manualAuto,manualAdd,manualFill,manualDelSel,autoGrid,S:()=>S,getLayout,activeMods,kwp,simulate,economics,designCheck,autoDesign,applyAuto,autoStrings,volts,parseLoc,usePanel,setClim:c=>{CLIM=c;CLIMSRC='nasa';inval()},set:o=>{S=Object.assign(DEF(),o);inval()},go,plane,acPart,sunAt};
if(!S.pv.id){const p=cat().panels[0];if(p)usePanel(p)}
go(0);
</script>
