<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบสอบ Pre/Post Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7fd;--card:#fff;--ink:#12263f;--mute:#5b6b80;--line:#d6e2f0;--pri:#0f3d8a;--pri2:#1c7ed6;--ok:#1b7f3b;--okbg:#e6f6ec;--bad:#c92a2a;--badbg:#fdeaea;--warn:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1722;--card:#17212f;--ink:#e6edf6;--mute:#9db0c7;--line:#2a3a50;--pri:#6aa6ff;--pri2:#4b95f0;--ok:#5fd18a;--okbg:#14301f;--bad:#ff8585;--badbg:#3a1a1a;--warn:#3a3114}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Sarabun,Tahoma,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 2px;color:var(--pri)}
h2{font-size:20px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[readonly]{opacity:.75}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--pri2);color:#fff}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.day{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day b{color:var(--pri)}
.day .t{flex:1 1 260px}
.day .btns{display:flex;gap:8px}
.day .btns button{padding:8px 14px;font-size:15px}
.note{background:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600}
.q{margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.q .n{font-weight:700;color:var(--pri)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{width:auto;margin-top:5px}
.opt.sel{border-color:var(--pri2);background:rgba(28,126,214,.1)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.bar .track{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--pri2);width:0;transition:width .2s}
.score{text-align:center;padding:18px 8px}
.score .big{font-size:56px;font-weight:700;color:var(--pri);line-height:1.1}
.item{border-radius:10px;padding:10px 12px;margin:8px 0;border:1px solid var(--line)}
.item.ok{background:var(--okbg)}
.item.no{background:var(--badbg)}
.item .r{font-weight:700}
.ok .r{color:var(--ok)}.no .r{color:var(--bad)}
.small{font-size:14px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="course">ระบบสอบ Pre/Post Test</h1>
  <p class="sub">หลักสูตรโซลาร์เซลล์สำหรับครัวเรือน (Non-degree)</p>
  <div id="err" class="err" hidden></div>
  <div id="view"><p class="sub">กำลังโหลด…</p></div>
</div>

<script>
const INIT = <?!= init ?>;
const $ = (id) => document.getElementById(id);
let INFO = null, STATE = { screen: 'home' }, QUIZ = null, ANS = [], BUSY = false;

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); })[fn].apply(null, args);
  });
}
function msg(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }
function showErr(t) { const b = $('err'); if (t) { b.textContent = t; b.hidden = false; window.scrollTo(0, 0); } else { b.hidden = true; } }
function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}
function typeName(t) { return t === 'pre' ? 'Pre-test (ก่อนเรียน)' : 'Post-test (หลังเรียน)'; }
function mount(node) { const v = $('view'); v.textContent = ''; v.appendChild(node); window.scrollTo(0, 0); }

function home() {
  showErr('');
  STATE.screen = 'home';
  const card = el('div', { class: 'card' }, [el('h2', { text: 'เลือกวันและประเภทการสอบ' })]);
  INFO.days.forEach(function (d) {
    const b1 = el('button', { text: 'Pre-test', onclick: function () { form(d, 'pre'); } });
    const b2 = el('button', { class: 'sec', text: 'Post-test', onclick: function () { form(d, 'post'); } });
    if (!d.preOpen) { b1.disabled = true; b1.textContent = 'Pre ปิด'; }
    if (!d.postOpen) { b2.disabled = true; b2.textContent = 'Post ปิด'; }
    card.appendChild(el('div', { class: 'day' }, [
      el('div', { class: 't' }, [el('b', { text: 'วันที่ ' + d.day + ' · ' + d.date }), el('div', { class: 'small', text: d.title })]),
      el('div', { class: 'btns' }, [b1, b2])
    ]));
  });
  card.appendChild(el('p', { class: 'small', text: 'ปุ่มที่กดไม่ได้ = ผู้สอนยังไม่เปิดให้สอบ' }));
  mount(card);
}

function form(d, type) {
  showErr('');
  STATE = { screen: 'form', d: d, type: type };
  const isPre = type === 'pre';
  const saved = (function () { try { return JSON.parse(localStorage.getItem('quizUser') || '{}'); } catch (e) { return {}; } })();
  const name = el('input', { id: 'f_name', maxlength: '80', autocomplete: 'name', placeholder: 'ชื่อ-สกุล', value: saved.name || '' });
  const group = el('select', { id: 'f_group' }, [el('option', { value: '', text: '— เลือกกลุ่ม —' })]);
  for (let g = 1; g <= INFO.groups; g++) { const o = el('option', { value: String(g), text: 'กลุ่ม ' + g }); if (String(saved.group) === String(g)) o.selected = true; group.appendChild(o); }
  const email = el('input', { id: 'f_email', type: 'email', autocomplete: 'email', placeholder: 'name@example.com', value: INFO.activeEmail || saved.email || '' });
  if (INFO.activeEmail) email.readOnly = true;
  const go = el('button', { text: 'เริ่มทำข้อสอบ', onclick: start });
  const card = el('div', { class: 'card' }, [
    el('h2', { text: typeName(type) + ' · วันที่ ' + d.day }),
    el('div', { class: 'small', text: d.date + ' · ' + d.title }),
    el('div', { class: 'note', text: isPre ? 'Pre-test: ระบบแจ้งเฉพาะคะแนนเมื่อส่งข้อสอบ ไม่แสดงว่าข้อใดถูกหรือผิด' : 'Post-test: ระบบแจ้งคะแนนและข้อถูก/ผิด และส่งผลไปที่อีเมลของคุณ' }),
    el('label', { for: 'f_name', text: 'ชื่อ-สกุล' }), name,
    el('label', { for: 'f_group', text: 'กลุ่ม workshop' }), group,
    el('label', { for: 'f_email', text: 'อีเมล' + (INFO.activeEmail ? ' (ยืนยันจากบัญชีของคุณ)' : '') }), email,
    el('p', { class: 'small', text: '20 ข้อ ตอบได้ข้อละ 1 คำตอบ เมื่อส่งแล้วแก้ไขไม่ได้' }),
    el('div', { class: 'row' }, [go, el('button', { class: 'sec', text: 'กลับ', onclick: home })])
  ]);
  mount(card);
  function start() {
    if (BUSY) return;
    const req = { day: d.day, type: type, name: name.value, group: group.value, email: email.value };
    try { localStorage.setItem('quizUser', JSON.stringify({ name: name.value, group: group.value, email: email.value })); } catch (e) {}
    BUSY = true; go.disabled = true; go.textContent = 'กำลังเตรียมข้อสอบ…'; showErr('');
    call('startQuiz', req).then(function (q) { BUSY = false; QUIZ = q; ANS = new Array(q.questions.length).fill(-1); quiz(); })
      .catch(function (e) { BUSY = false; go.disabled = false; go.textContent = 'เริ่มทำข้อสอบ'; showErr(msg(e)); });
  }
}

function quiz() {
  showErr('');
  STATE.screen = 'quiz';
  const n = QUIZ.questions.length;
  const fill = el('div', { class: 'fill' });
  const cnt = el('span', { class: 'small', text: 'ตอบแล้ว 0 / ' + n });
  const wrap = el('div');
  wrap.appendChild(el('div', { class: 'bar' }, [el('div', { class: 'row', style: 'justify-content:space-between' }, [el('b', { text: typeName(QUIZ.type) + ' · วันที่ ' + QUIZ.day }), cnt]), el('div', { class: 'track' }, [fill])]));
  const submit = el('button', { text: 'ส่งข้อสอบ', onclick: send });
  QUIZ.questions.forEach(function (q, i) {
    const box = el('div', { class: 'q' }, [el('div', {}, [el('span', { class: 'n', text: (i + 1) + '. ' }), document.createTextNode(q.q)])]);
    q.c.forEach(function (c, k) {
      const radio = el('input', { type: 'radio', name: 'q' + i });
      const lab = el('label', { class: 'opt', style: 'font-weight:400;margin:6px 0' }, [radio, el('span', { text: c })]);
      radio.addEventListener('change', function () {
        ANS[i] = k;
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function (o) { o.classList.remove('sel'); });
        lab.classList.add('sel');
        const done = ANS.filter(function (x) { return x >= 0; }).length;
        cnt.textContent = 'ตอบแล้ว ' + done + ' / ' + n; fill.style.width = (done / n * 100) + '%';
      });
      box.appendChild(lab);
    });
    wrap.appendChild(box);
  });
  wrap.appendChild(submit);
  mount(wrap);
  window.onbeforeunload = function () { return STATE.screen === 'quiz' ? 'ข้อสอบยังไม่ส่ง' : undefined; };
  function send() {
    if (BUSY) return;
    const left = ANS.filter(function (x) { return x < 0; }).length;
    if (left && !confirm('ยังไม่ได้ตอบ ' + left + ' ข้อ ต้องการส่งเลยหรือไม่?')) return;
    BUSY = true; submit.disabled = true; submit.textContent = 'กำลังตรวจข้อสอบ…'; showErr('');
    call('submitQuiz', QUIZ.token, ANS).then(function (r) { BUSY = false; window.onbeforeunload = null; result(r); })
      .catch(function (e) { BUSY = false; submit.disabled = false; submit.textContent = 'ส่งข้อสอบ'; showErr(msg(e)); });
  }
}

function result(r) {
  STATE.screen = 'result';
  const pre = r.type === 'pre';
  const root = el('div');
  const head = el('div', { class: 'card score' }, [
    el('div', { class: 'small', text: typeName(r.type) + ' · ' + r.title }),
    el('div', { class: 'big', text: r.score + ' / ' + r.total }),
    el('div', { text: r.percent + '%' })
  ]);
  if (!pre && r.preScore !== undefined) head.appendChild(el('div', { class: 'small', text: 'Pre-test ' + r.preScore + ' คะแนน · พัฒนาการ ' + (r.gain >= 0 ? '+' : '') + r.gain + ' คะแนน' }));
  if (pre) head.appendChild(el('div', { class: 'small', text: 'Pre-test แจ้งเฉพาะคะแนน ไม่แสดงข้อถูก/ผิด' }));
  head.appendChild(el('div', { class: 'small', text: r.emailed ? 'ส่งผลไปที่ ' + r.email + ' แล้ว' : (!pre ? 'ส่งอีเมลไม่สำเร็จ โปรดบันทึกหน้าจอนี้ไว้' : '') }));
  root.appendChild(head);
  if (!pre) {
    const c = el('div', { class: 'card' }, [el('h2', { text: 'ผลรายข้อ' })]);
    r.details.forEach(function (d) {
      const it = el('div', { class: 'item ' + (d.correct ? 'ok' : 'no') }, [
        el('div', {}, [el('span', { class: 'r', text: (d.correct ? '✔ ถูก' : '✘ ผิด') + ' · ข้อ ' + d.no }), document.createTextNode(' ' + d.q)]),
        el('div', { class: 'small', text: 'คำตอบของคุณ: ' + d.yourAnswer })
      ]);
      if (d.correctAnswer) it.appendChild(el('div', { class: 'small', style: 'color:var(--ok);font-weight:600', text: 'เฉลย: ' + d.correctAnswer }));
      c.appendChild(it);
    });
    root.appendChild(c);
  }
  root.appendChild(el('button', { class: 'sec', text: 'กลับหน้าแรก', onclick: function () { init(); } }));
  mount(root);
}

function init() {
  showErr('');
  call('getQuizInfo').then(function (info) {
    INFO = info;
    $('course').textContent = 'ระบบสอบ Pre/Post Test';
    const d = INFO.days.filter(function (x) { return x.day === INIT.day; })[0];
    if (d && INIT.type) { INIT.day = 0; form(d, INIT.type); } else { home(); }
  }).catch(function (e) { $('view').textContent = ''; showErr(msg(e)); });
}
init();
</script>
</body>
</html>
